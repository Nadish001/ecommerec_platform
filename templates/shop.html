{% extends 'base.html' %}
{% block content %}
<link rel="stylesheet" href="/static/css/shop.css">

{% if user.is_superuser %}
<a href="{% url 'addpro' %}"><button>Add Product</button></a>
<a href="{% url 'addcat' %}"><button>Add Cat</button></a>
{% endif%}


    <div class="main1"> 
    {%for i in pro%}
        <div class="card">
            <img src="{{i.img}}" alt="">
            <p>{{i.name}}</p>

            <p>price:₹{{i.price}}</i></p>
            <a href="{% url 'prodetails' i.id %}"><button>Details</button></a>
        </div>
    {%endfor%}
    </div>



    
    {% endblock %}}
