{% extends "base.html" %}

{% block content %}
<link rel="stylesheet" href="/static/css/prodetails.css">
<div class="main1">
    <div class="im">
        <img src="/ecommerce/{{po.img}}" alt="" >
    </div>
    <div class="details">
        <div class="f1">
            <h1 class='b1'>{{po.name}}</h1>
            <div class="hhh">
            <p>Product_des:</p>
            <h3>{{po.des}}</h3>
            </div>
            <p>Price:{{po.price}}</p>
           
        </div>
        <div class="f2">
            {% if po.qty == 0 %}
                <a class ='span' href="{% url 'addcart' po.id%}">add to cart</a>
            {% else %}
                <div class="car">
                            <a href="{% url 'minus' po.id%}">-</a>
                            <p>{{ po.qty }}</p>
                            <a href="{% url 'add' po.id %}">+</a>
                </div>
            {% endif %}
                    <div class="aa">
                    <a href="{% url 'editpro' po.id %}">Edit</a>
                    <a href="{% url 'deletepro' po.id %}">Delete</a>
                    </div>
        </div>
    </div>
</div>
{% endblock %}
